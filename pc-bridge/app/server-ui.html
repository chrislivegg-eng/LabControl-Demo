<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabControl · Servidor</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: #1f1b18;
        background:
          radial-gradient(circle at top left, rgba(249, 115, 22, .22), transparent 34%),
          linear-gradient(145deg, #fff7f2 0%, #fff 60%, #fee9dc 100%);
        padding: 22px;
      }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .brand-mark {
        display: grid; width: 48px; height: 48px; place-items: center;
        border-radius: 14px; background: #f97316; color: #fff; font-weight: 900;
        letter-spacing: -.04em; font-size: 18px; box-shadow: 0 10px 22px rgba(249,115,22,.35);
      }
      .brand h1 { margin: 0; font-size: 20px; line-height: 1; }
      .brand p { margin: 3px 0 0; color: #8a7a70; font-size: 12px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .12em; }

      .card {
        border: 1px solid rgba(249,115,22,.16); border-radius: 22px;
        background: rgba(255,255,255,.9); box-shadow: 0 18px 50px rgba(41,22,10,.12);
        padding: 20px; margin-bottom: 14px;
      }
      .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .pill {
        display: inline-flex; align-items: center; gap: 9px; font-weight: 900; font-size: 17px;
        padding: 9px 16px; border-radius: 999px;
      }
      .pill .dot { width: 11px; height: 11px; border-radius: 50%; }
      .pill.on { background: #e9f9ee; color: #16a34a; }
      .pill.on .dot { background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.18); }
      .pill.off { background: #fff4e5; color: #c2560c; }
      .pill.off .dot { background: #f59e0b; }
      .stamp { color: #9a8a80; font-size: 12px; font-weight: 600; }

      .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
      .mini { background: #fff8f4; border: 1px solid #ffe0cf; border-radius: 14px; padding: 12px; text-align: center; }
      .mini b { display: block; font-size: 22px; color: #171412; }
      .mini span { font-size: 10px; font-weight: 800; color: #8a7a70; text-transform: uppercase; letter-spacing: .08em; }

      .addr-title { font-size: 11px; font-weight: 900; color: #8a7a70; text-transform: uppercase;
        letter-spacing: .1em; margin: 2px 0 10px; }
      .addr { display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 10px 12px; border: 1px solid #ead8cc; border-radius: 12px; background: #fff; margin-bottom: 8px; }
      .addr .lbl { font-size: 11px; color: #8a7a70; font-weight: 800; min-width: 86px; }
      .addr code { font-size: 14px; color: #c2410c; font-weight: 800; flex: 1; word-break: break-all; }
      .copy { border: 0; background: #fff1e7; color: #ea580c; font-weight: 800; font-size: 12px;
        padding: 7px 11px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
      .copy:hover { background: #ffe3d2; }

      .actions { display: flex; gap: 10px; }
      button.main {
        flex: 1; border: 0; border-radius: 13px; padding: 13px; font-weight: 900; font-size: 14px; cursor: pointer;
      }
      .open { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff;
        box-shadow: 0 10px 22px rgba(249,115,22,.28); }
      .stop { background: #fff; color: #dc2626; border: 1px solid #f3c6c6 !important; }
      .stop:hover { background: #fef2f2; }

      .foot { text-align: center; color: #9a8a80; font-size: 12px; margin-top: 14px; line-height: 1.5; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="brand-mark">LC</div>
      <div>
        <h1><span style="color:#171412">Lab</span><span style="color:#f97316">Control</span></h1>
        <p>Servidor del laboratorio</p>
      </div>
    </div>

    <div class="card">
      <div class="status-row">
        <span class="pill off" id="pill"><span class="dot"></span><span id="pill-text">Iniciando…</span></span>
        <span class="stamp" id="port-stamp"></span>
      </div>
      <div class="mini-grid">
        <div class="mini"><b id="m-pcs">—</b><span>Equipos</span></div>
        <div class="mini"><b id="m-port">—</b><span>Puerto</span></div>
        <div class="mini"><b id="m-disc">—</b><span>Búsqueda auto.</span></div>
      </div>
    </div>

    <div class="card">
      <p class="addr-title">Direcciones del panel</p>
      <div class="addr">
        <span class="lbl">En esta PC</span>
        <code id="u-local">http://127.0.0.1</code>
        <button class="copy" data-copy="u-local">Copiar</button>
      </div>
      <div class="addr">
        <span class="lbl">Desde otras</span>
        <code id="u-ip">—</code>
        <button class="copy" data-copy="u-ip">Copiar</button>
      </div>
      <div class="addr">
        <span class="lbl">Por nombre</span>
        <code id="u-host">—</code>
        <button class="copy" data-copy="u-host">Copiar</button>
      </div>
    </div>

    <div class="actions">
      <button class="main open" id="btn-open">Abrir panel</button>
      <button class="main stop" id="btn-stop">Detener servidor</button>
    </div>

    <p class="foot">Entra al panel como <b>maestro</b>.<br />Deja esta ventana abierta durante la clase.</p>

    <script>
      const { ipcRenderer } = require('electron');
      let panelUrl = 'http://127.0.0.1';

      function suffix(port) { return port === 80 ? '' : ':' + port; }

      ipcRenderer.on('status', (_e, s) => {
        const pill = document.getElementById('pill');
        const pillText = document.getElementById('pill-text');
        const sfx = suffix(s.port || 80);

        if (s.online) {
          pill.className = 'pill on';
          pillText.textContent = 'EN LÍNEA';
          document.getElementById('port-stamp').textContent = 'Puerto ' + (s.port || '—');
          document.getElementById('m-pcs').textContent = (s.pcs ?? 0);
          document.getElementById('m-port').textContent = (s.port || '—');
          document.getElementById('m-disc').textContent = s.discovery ? '✓' : '—';
          panelUrl = 'http://127.0.0.1' + sfx;
        } else {
          pill.className = 'pill off';
          pillText.textContent = 'Iniciando…';
          document.getElementById('port-stamp').textContent = '';
          document.getElementById('m-pcs').textContent = '—';
          document.getElementById('m-port').textContent = '—';
          document.getElementById('m-disc').textContent = '—';
        }

        document.getElementById('u-local').textContent = 'http://127.0.0.1' + sfx;
        document.getElementById('u-ip').textContent = s.ip ? 'http://' + s.ip + sfx : 'Buscando IP…';
        document.getElementById('u-host').textContent = s.hostname ? 'http://' + s.hostname + sfx : '—';
      });

      document.querySelectorAll('.copy').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = document.getElementById(btn.dataset.copy).textContent;
          navigator.clipboard.writeText(text).then(() => {
            const old = btn.textContent; btn.textContent = '¡Copiado!';
            setTimeout(() => { btn.textContent = old; }, 1200);
          }).catch(() => {});
        });
      });

      document.getElementById('btn-open').addEventListener('click', () => {
        ipcRenderer.send('open-panel', panelUrl);
      });
      document.getElementById('btn-stop').addEventListener('click', () => {
        if (confirm('¿Detener el servidor del laboratorio? Las PCs dejarán de reportar.')) {
          ipcRenderer.send('stop-server');
        }
      });
    </script>
  </body>
</html>
